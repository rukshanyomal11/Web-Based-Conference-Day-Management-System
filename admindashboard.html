<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Schedule</title>
    <link rel="stylesheet" href="admindashboard.css">
</head>
<body>
    <!-- Header Section -->
    <header class="main-header">
        <div class="container">
            <div class="header-content">
                <p>Conference Manager Admin</p>
            </div>
        </div>
    </header>

    <!-- Sidebar -->
    <div class="sidebar">
        <ul>
            <li><a href="admindashboard.html">Session Schedule</a></li>

    <!-- Main Content -->
    <div class="main-content">
        <h3>Session Schedule Add</h3>
        
        <!-- Form for Adding New Session -->
        <h4>Add New Session</h4>
        <form class="add-session-form">
            <label for="speaker">Speaker:</label>
            <input type="text" id="speaker" name="speaker" required><br><br>
            
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required><br><br>
            
            <label for="datetime">Date and Time:</label>
            <input type="datetime-local" id="datetime" name="datetime" required><br><br>
            
            <button type="submit" class="btn-submit">Add Session</button>
        </form>
    </div>
</body>
